# Experiment 7: Ablation Studies

## Purpose
Ablation studies to understand contribution of each component:
1. No positional encoding
2. No count weighting
3. No consistency loss
4. No curriculum learning

## Usage
`ash
python experiments/exp7_ablation/run_ablation.py
