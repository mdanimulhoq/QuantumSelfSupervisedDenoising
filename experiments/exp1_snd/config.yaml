data:
  batch_size: 16
  circuits_per_n:
    4: 2000
    6: 1500
    8: 1500
  data_dir: data/raw/exp1_snd
  high_shots: 100000
  low_shots: 100
  n_qubits:
  - 4
  - 6
  - 8
  num_workers: 0
device: cpu
experiment:
  description: "SN-D validation: low-shot \u2192 high-shot mapping"
  name: exp1_snd
logging:
  log_interval: 10
  wandb_entity: null
  wandb_project: n2ln-qem
loss:
  alpha: 0.1
  beta: 3.5
  consistency: 0.0
  entropy_floor: 0.0
  entropy_tolerance: 0.05
  gamma: 0.0
  physicality: 0.0
  sharpness: 1.6
  sharpness_margin: 0.02
model:
  d_ff: 256
  d_model: 64
  decoder_hidden: 128
  dropout: 0.1
  m: 16
  n_heads: 4
  n_isab: 2
  n_sab: 1
  temperature_floor: 0.01
  use_mlp_scorer: true
seed: 42
training:
  early_stop_patience: 10
  epochs: 50
  grad_clip: 1.0
  lr: 0.0003
  mode: sn_only
  weight_decay: 0.01
