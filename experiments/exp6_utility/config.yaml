# Experiment 6: Utility-Scale Hardware (127-qubit)

## Purpose
Collect data from 127-qubit IBMQ hardware (Brisbane/Kyiv).
SN-D only mode (shot-noise reduction).

## Prerequisites
- Step 8.1: IBMQ interface
- IBMQ account with access to 127-qubit backend

## Usage
`ash
python experiments/exp6_utility/collect.py
@"
