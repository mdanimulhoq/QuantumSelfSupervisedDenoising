# Experiment 1: SN-D Training Configuration (Updated for MLP Scorer + Sharpness Loss)

experiment:
  name: "exp1_snd"
  description: "SN-D validation: low-shot → high-shot mapping"

data:
  data_dir: "data/raw/exp1_snd"
  n_qubits: [4, 6, 8]
  circuits_per_n: {4: 2000, 6: 1500, 8: 1500}
  low_shots: 100
  high_shots: 100000
  batch_size: 16
  num_workers: 0

model:
  d_model: 64
  n_heads: 4
  n_isab: 2
  n_sab: 1
  d_ff: 256
  m: 16
  decoder_hidden: 128
  dropout: 0.1
  use_mlp_scorer: true          # 🔥 MLP Scorer চালু করুন (ডট-প্রোডাক্টের বদলে)
  temperature_floor: 0.3        # 🔥 Logit explosion বন্ধ করতে (minimum temperature)

training:
  mode: "sn_only"
  epochs: 50
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  early_stop_patience: 10

loss:
  # 🔥 Advance AI-এর প্রস্তাবিত ওজন (KL কম, TVD বেশি, Sharpness যোগ)
  alpha: 0.1             # KL weight (কমালে স্মুথিং কমে)
  beta: 2.0              # TVD weight (বাড়ালে TVD-তে জোর বাড়ে)
  gamma: 0.0             # Chi² বন্ধ (অস্থিরতা কমাতে)
  sharpness: 0.5         # 🔥 Sharpness loss weight (max_pred কে target_max-এর কাছে ধাক্কা দেবে)
  sharpness_margin: 0.02 # 🔥 margin for sharpness loss
  entropy_floor: 0.0     # 🔥 ঐচ্ছিক (এখন বন্ধ)
  entropy_tolerance: 0.05
  consistency: 0.3       # Cross-stage consistency (যদি unified mode ব্যবহার করেন)
  physicality: 0.0       # Physicality বন্ধ (softmax already ensures valid distribution)

logging:
  wandb_project: "n2ln-qem"
  wandb_entity: null
  log_interval: 10

seed: 42
device: "cpu"